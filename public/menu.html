<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>قائمة المطعم</title>
<style>
:root{--green:#17372b;--gold:#d69b42;--bg:#f7f1e7;--ink:#19251f;--muted:#6e756f;--line:#e4dccf}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial}button,input{font:inherit}.hero{padding:22px 5% 72px;background:linear-gradient(130deg,#10271e,#29513f);color:#fff}.wrap{width:min(1080px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.brand small{color:#dcc79e;letter-spacing:.16em}.brand h1{margin:3px 0}.lang{border:1px solid #ffffff55;background:#ffffff14;color:#fff;border-radius:99px;padding:9px 15px}.intro{margin-top:48px;max-width:620px}.intro b{color:var(--gold)}.intro h2{font-size:clamp(35px,7vw,60px);margin:8px 0}.intro p{color:#d7e1dc;line-height:1.8}.content{width:min(1080px,94%);margin:-35px auto 50px}.search{background:#fff;border-radius:16px;padding:8px 15px;box-shadow:0 15px 35px #17372b20}.search input{width:100%;border:0;outline:0;padding:11px;background:transparent}.chips{display:flex;gap:8px;overflow:auto;padding:22px 0 14px;position:sticky;top:0;background:linear-gradient(var(--bg) 80%,transparent);z-index:2;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:9px 16px;border-radius:99px}.chip.active{background:var(--green);color:#fff}.section{margin-top:23px;scroll-margin-top:70px}.section-head{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:13px}.section-head h2{margin:0}.section-head span{color:var(--muted)}.items{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.item{display:grid;grid-template-columns:145px 1fr;background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;min-height:145px}.photo{background:#e9e2d6 center/cover}.info{padding:14px;display:flex;flex-direction:column}.info h3{margin:0}.alt{direction:ltr;text-align:left;color:var(--muted);font-size:12px;margin-top:4px}.desc{color:var(--muted);line-height:1.55;font-size:14px}.price{margin-top:auto;color:#b67720;font-weight:bold;font-size:18px}.empty{text-align:center;padding:70px 15px;color:var(--muted)}.loader{width:40px;height:40px;border:4px solid #ddd;border-top-color:var(--gold);border-radius:50%;animation:s .8s linear infinite;margin:70px auto}@keyframes s{to{transform:rotate(360deg)}}.hidden{display:none}footer{text-align:center;color:var(--muted);padding:20px}@media(max-width:720px){.items{grid-template-columns:1fr}.item{grid-template-columns:112px 1fr;min-height:135px}.desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}}
</style>
</head>
<body>
<header class="hero"><div class="wrap"><div class="top"><div class="brand"><small>RESTAURANT</small><h1 id="brand">قائمتنا</h1></div><button id="lang" class="lang">English</button></div><div class="intro"><b data-ar="أهلاً وسهلاً" data-en="WELCOME">أهلاً وسهلاً</b><h2 data-ar="نكهات بتحكي عنّا" data-en="Flavours that tell our story">نكهات بتحكي عنّا</h2><p data-ar="اختاروا من تشكيلتنا المحضّرة بعناية واستمتعوا بأطيب الأطباق." data-en="Explore our carefully prepared selection and enjoy every bite.">اختاروا من تشكيلتنا المحضّرة بعناية واستمتعوا بأطيب الأطباق.</p></div></div></header>
<main class="content"><div class="search"><input id="search" placeholder="ابحث عن طبق..."></div><nav id="chips" class="chips"></nav><div id="loader" class="loader"></div><div id="sections"></div><div id="empty" class="empty hidden">لا توجد أصناف حالياً.</div></main>
<footer data-ar="نتمنى لكم تجربة شهية" data-en="We hope you enjoy your meal">نتمنى لكم تجربة شهية</footer>
<script>
const API="",q=s=>document.querySelector(s),esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));let lang=localStorage.getItem("menu_lang")||"ar",cats=[],items=[],selected="all";const txt=(o,k)=>o[k+"_"+lang]||o[k+"_"+(lang==="ar"?"en":"ar")]||"";
function language(){document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";q("#lang").textContent=lang==="ar"?"English":"العربية";q("#brand").textContent=lang==="ar"?"قائمتنا":"Our Menu";q("#search").placeholder=lang==="ar"?"ابحث عن طبق...":"Search the menu...";document.querySelectorAll("[data-ar]").forEach(x=>x.textContent=x.dataset[lang]);render()}q("#lang").onclick=()=>{lang=lang==="ar"?"en":"ar";localStorage.setItem("menu_lang",lang);language()};q("#search").oninput=render;
async function load(){try{const [a,b]=await Promise.all([fetch(API+"/api/categories/getAllCatActive"),fetch(API+"/api/items/getAllActiveItems")]),[c,i]=await Promise.all([a.json(),b.json()]);if(!a.ok||!b.ok||c.success===false||i.success===false)throw Error();cats=c.data||[];items=i.data||[];q("#loader").classList.add("hidden");render()}catch{q("#loader").classList.add("hidden");q("#empty").classList.remove("hidden");q("#empty").textContent=lang==="ar"?"تعذّر تحميل القائمة.":"Could not load the menu."}}
function render(){if(!cats.length&&!items.length)return;const query=q("#search").value.trim().toLowerCase();q("#chips").innerHTML=`<button class="chip ${selected==="all"?"active":""}" onclick="pick('all')">${lang==="ar"?"الكل":"All"}</button>`+cats.map(c=>`<button class="chip ${selected==c.id?"active":""}" onclick="pick('${c.id}')">${esc(txt(c,"name"))}</button>`).join("");let html="",count=0;cats.filter(c=>selected==="all"||selected==c.id).forEach(c=>{const list=items.filter(i=>i.category_id==c.id&&(!query||`${i.name_ar} ${i.name_en} ${i.description_ar||""} ${i.description_en||""}`.toLowerCase().includes(query)));if(!list.length)return;count+=list.length;html+=`<section id="cat-${c.id}" class="section"><div class="section-head"><h2>${esc(txt(c,"name"))}</h2><span>${list.length} ${lang==="ar"?"أصناف":"items"}</span></div><div class="items">${list.map(i=>`<article class="item"><div class="photo" style="background-image:url('${esc(i.image_url||"")}')"></div><div class="info"><h3>${esc(txt(i,"name"))}</h3><div class="alt">${esc(i["name_"+(lang==="ar"?"en":"ar")]||"")}</div><p class="desc">${esc(txt(i,"description"))}</p><div class="price">${Number(i.price).toLocaleString(lang==="ar"?"ar-LB":"en-US")} ${esc(i.currency)}</div></div></article>`).join("")}</div></section>`});q("#sections").innerHTML=html;q("#empty").classList.toggle("hidden",count>0);if(!count)q("#empty").textContent=lang==="ar"?"لا توجد أصناف مطابقة.":"No matching items."}
function pick(id){selected=id;render();if(id!=="all")q(`#cat-${id}`)?.scrollIntoView()}window.pick=pick;language();load();
</script></body></html>
